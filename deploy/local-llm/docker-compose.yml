# Self-hosted xiaozhi voice server (ASR + LLM routing + TTS) for StackChan,
# plus a local text-to-speech engine.
# Upstream project: https://github.com/xinnan-tech/xiaozhi-esp32-server
# Run ./render-config.sh first, then: docker compose up -d --build
services:
  xiaozhi-server:
    # The stock image plus the Anthropic SDK for the Claude preset.
    build: ./image
    image: stackchan-xiaozhi-server:local
    container_name: stackchan-xiaozhi-server
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=UTC
    ports:
      - "${XIAOZHI_WS_PORT:-8000}:${XIAOZHI_WS_PORT:-8000}"     # WebSocket the robot talks to
      - "${XIAOZHI_HTTP_PORT:-8003}:${XIAOZHI_HTTP_PORT:-8003}" # OTA + vision HTTP
    extra_hosts:
      # Lets the container reach an LLM on the Docker host as host.docker.internal
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/opt/xiaozhi-esp32-server/data
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
      # Extra LLM provider: thinking-off for llama.cpp-style servers (Strata)
      - ./providers/llamacpp:/opt/xiaozhi-esp32-server/core/providers/llm/llamacpp:ro
      # Extra LLM provider: Claude through the official Anthropic SDK
      - ./providers/claude:/opt/xiaozhi-esp32-server/core/providers/llm/claude:ro
      # LLM switchboard: holds every preset, picks the active one per request
      - ./providers/router:/opt/xiaozhi-esp32-server/core/providers/llm/router:ro
      # Extra vision providers: no forced-Chinese suffix and thinking-off for
      # Strata (llamacpp), Claude, and the vision switchboard (router)
      - ./providers/vllm/llamacpp.py:/opt/xiaozhi-esp32-server/core/providers/vllm/llamacpp.py:ro
      - ./providers/vllm/claude.py:/opt/xiaozhi-esp32-server/core/providers/vllm/claude.py:ro
      - ./providers/vllm/router.py:/opt/xiaozhi-esp32-server/core/providers/vllm/router.py:ro
    depends_on:
      - kokoro-tts

  # Local text-to-speech (Kokoro, CPU build). Only the voice server talks to
  # it, over the compose network, so no port is published and no firewall
  # rule is needed. Used when USE_TTS=local.
  kokoro-tts:
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:latest}
    container_name: stackchan-kokoro-tts
    restart: unless-stopped
    environment:
      # The voice models are inside the image. Without this the container
      # checks them against Hugging Face on every start.
      - HF_HUB_OFFLINE=1
